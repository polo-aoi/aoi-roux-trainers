name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to build'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - win
          - linux
          - mac
          - android
          - ios

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_CACHE: /tmp/electron-cache
  NODE_MIRROR: https://npmmirror.com/mirrors/node/
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  build:
    name: ${{ matrix.artifact_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            artifact_name: AoiRouxTrainers-win
          - os: ubuntu-22.04
            target: linux
            artifact_name: AoiRouxTrainers-linux
          - os: macos-15
            target: mac
            artifact_name: AoiRouxTrainers-mac
          - os: ubuntu-22.04
            target: android
            artifact_name: AoiRouxTrainers-android
          - os: macos-15
            target: ios
            artifact_name: AoiRouxTrainers-ios
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target
        run: npm install

      - name: Build web app
        if: github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target
        run: npm run build
        env:
          CI: "false"

      - name: Build Electron app
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target != 'android' && matrix.target != 'ios'
        run: npx electron-builder --${{ matrix.target }} --publish never

      - name: Setup Java 21
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'android'
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'android'
        run: |
          set -euo pipefail
          SDK_URL=https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p /opt/android-sdk/cmdline-tools
          curl -fsSL "$SDK_URL" -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-tmp
          mv /tmp/cmdline-tools-tmp/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          SDKMANAGER=/opt/android-sdk/cmdline-tools/latest/bin/sdkmanager
          java -version
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/opt/android-sdk" >> $GITHUB_ENV

      - name: Init Capacitor
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'android'
        run: |
          if [ -d "android" ]; then
            echo "android/ already exists, skipping cap init/add"
          else
            echo "=== Running cap init ==="
            npx cap init AoiRouxTrainers com.aoirouxtrainers.app --web-dir=build
            echo "=== Running cap add android ==="
            npx cap add android
          fi
          echo "=== Checking android/ directory ==="
          ls -la android/

      - name: Build Android APK
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'android'
        env:
          ANDROID_HOME: /opt/android-sdk
          ANDROID_SDK_ROOT: /opt/android-sdk
        run: |
          npx cap sync android
          cd android
          ANDROID_HOME=/opt/android-sdk ./gradlew assembleDebug --stacktrace

      - name: Verify APK exists
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'android'
        run: |
          echo "=== APK output check ==="
          ls -lh android/app/build/outputs/apk/debug/*.apk 2>/dev/null && echo "APK found!" || (echo "ERROR: No APK found at android/app/build/outputs/apk/debug/" && exit 1)

      - name: Init Capacitor iOS
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'ios'
        run: |
          set -euo pipefail
          if [ ! -d "ios" ]; then
            echo "=== Running cap init ==="
            npx cap init AoiRouxTrainers com.aoirouxtrainers.app --web-dir=build
            echo "=== Running cap add ios ==="
            npx cap add ios
          else
            echo "ios/ already exists, skipping cap init/add"
          fi
          echo "=== Checking ios/ directory ==="
          ls -la ios/

      - name: Generate Xcode scheme
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'ios'
        run: python3 scripts/gen-ios-scheme.py

      - name: Build iOS app
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'ios'
        run: |
          set -euo pipefail
          npx cap sync ios
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify iOS app exists
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'ios'
        run: |
          set -euo pipefail
          APP_PATH="ios/App/build/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: iOS app bundle not found at $APP_PATH"
            ls -R ios/App/build/Build/Products 2>/dev/null || true
            exit 1
          fi
          echo "iOS app found!"
          ls -lh "$APP_PATH"

      - name: Package iOS app (zip)
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'ios'
        run: |
          set -euo pipefail
          mkdir -p release
          cd ios/App/build/Build/Products/Debug-iphonesimulator
          zip -qry "$GITHUB_WORKSPACE/release/AoiRouxTrainers-ios-simulator.app.zip" App.app
          cd "$GITHUB_WORKSPACE"
          ls -lh release/

      - name: Upload iOS artifact
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'ios'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.zip
          retention-days: 30

      - name: Upload artifact
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target != 'android' && matrix.target != 'ios'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.zip
            release/*.AppImage
            release/*.tar.gz
            release/*.dmg
          retention-days: 30

      - name: Upload Android artifact
        if: (github.event.inputs.platform == '' || github.event.inputs.platform == 'all' || github.event.inputs.platform == matrix.target) && matrix.target == 'android'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: release

      - name: Flatten artifacts
        run: |
          mkdir -p dist
          for dir in release/*/; do
            cp -r "$dir"* dist/ 2>/dev/null || true
          done
          echo "Files to upload:"
          ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
