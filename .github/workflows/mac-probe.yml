name: Mac Runner Probe
on:
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, tag: macos-14}
          - {os: macos-15, tag: macos-15}
          - {os: macos-latest, tag: macos-latest}
          - {os: macos-13, tag: macos-13}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Probe
        run: echo "hello from ${{ matrix.tag }}"; sw_vers; uname -m
